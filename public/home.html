<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG Compass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <!-- Đã sửa thành thẻ a trỏ về /home -->
            <a href="/home" class="logo-link" id="homeLink">ESG COMPASS</a>
            <div class="nav-links">
                <span>|</span>
                <a href="/about">About</a>
                <span>|</span>
                <a href="/help">Help</a>
                <span>|</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="divider"></div>

        <div class="hero">
            <div class="hero-row">
                <h1 class="hero-title">GREEN TRANSITION</h1>
            </div>
            
            <div class="hero-row">
                <h1 class="hero-title">FOR GARMENT</h1>
            </div>
            
            <div class="hero-row last-row">
                <h1 class="hero-title">BUSINESSES</h1>
                <div class="hero-desc">
                    <p>Understand energy consumption, carbon impact,<br>and improvement opportunities relevant to the business.</p>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="cta-section">
            <button class="btn-start" id="startBtn">START ASSESSMENT</button>
            <p class="cta-note">No account registration required</p>
        </div>

        <div class="divider"></div>

        <div class="steps-grid">
            <div class="step-number">01</div>
            <div></div>
            <div class="step-number">02</div>
            <div></div>
            <div class="step-number">03</div>

            <div class="line"></div>
            <div class="arrow-wrapper">
                <div class="arrow-tail"></div>
                <div class="arrow-head"></div>
            </div>
            <div class="line"></div>
            <div class="arrow-wrapper">
                <div class="arrow-tail"></div>
                <div class="arrow-head"></div>
            </div>
            <div class="line"></div>

            <div class="step-name">MEASURE</div>
            <div></div>
            <div class="step-name">ANALYZE</div>
            <div></div>
            <div class="step-name">IMPROVE</div>

            <div class="line"></div>
            <div class="arrow-wrapper">
                <div class="arrow-tail"></div>
                <div class="arrow-head"></div>
            </div>
            <div class="line"></div>
            <div class="arrow-wrapper">
                <div class="arrow-tail"></div>
                <div class="arrow-head"></div>
            </div>
            <div class="line"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
